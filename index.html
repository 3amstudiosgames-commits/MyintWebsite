<!Doctype html>
<style>
    body{
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2%;
    }
    .box{
        background-color: aquamarine;
    }
    .grid-container{
        display: grid;
        grid-template-columns: 200px 200px 200px 200px 200px 200px 200px;
        grid-template-rows: 100px 200px 200px 100px 80px 300px;
        gap: 1em;
        grid-auto-rows:  1fr;
        grid-template-areas:
        "box-1 box-1 box-1 box-1 box-1 box-1 box-1"
        "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
        "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
        "box-2 box-2 box-5 box-5 box-6 box-4 box-4"
        "box-2 box-2 box-5 box-5 box-6 box-4 box-4"
        "box-7 box-7 box-8 box-8 box-8 box-9 box-9";
         
    }
@media(max-width: 56em){
    .grid-container{
        grid-template-columns: 200px 200px 200px 200px 200px 200px 200px;
        grid-template-rows: 100px 200px 200px 100px 80px 300px;
        grid-template-areas:
        "box-1 box-1 box-1 box-1 box-1 box-1 box-1"
        "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
        "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
        "box-2 box-2 box-5 box-5 box-6 box-4 box-4"
        "box-2 box-2 box-5 box-5 box-6 box-4 box-4"
        "box-7 box-7 box-8 box-8 box-8 box-9 box-9";


    }
} 
</style>
<html>
    <body>
        <div class="grid-container">
            <div class="box" style="grid-area: box-1"></div>
            <div class="box" style="grid-area: box-2"></div>
            <div class="box" style="grid-area: box-3"></div>
            <div class="box" style="grid-area: box-4"></div>
            <div class="box" style="grid-area: box-5"></div>
            <div class="box" style="grid-area: box-6"></div>
            <div class="box" style="grid-area: box-7"></div>
            <div class="box" style="grid-area: box-8"></div>
            <div class="box" style="grid-area: box-9"></div>
        </div>
    </body>
</html>
