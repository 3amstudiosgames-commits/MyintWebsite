<!Doctype html>
<style>
    body{
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2%;
    }
    .box{
        background-color: aquamarine;
    }
    .grid-container{
        display: grid;
        grid-template-columns: 200px 200px 200px 200px 200px;
        grid-template-rows: 80px 400px 400px 200px ;
        gap: 1em;
        grid-auto-rows:  1fr;
        grid-template-areas:
         "box-1 box-1 box-1 box-1 box-1"
         "box-2 box-3 box-3 box-4 box-4"
         "box-2 box-3 box-3 box-4 box-4"
         "box-5 box-5 box-5 box-5 box-5"
         "box-5 box-5 box-5 box-5 box-5";
         
    }
@media(max-width: 56em){
    .grid-container{
        grid-template-columns: 200px 200px 200px 200px 200px;
        grid-template-rows: 80px 400px 400px 200px ;
        grid-template-areas:
        "box-1 box-1 box-1 box-1 box-1"
        "box-2 box-3 box-3 box-4 box-4"
        "box-2 box-3 box-3 box-4 box-4"
        "box-5 box-5 box-5 box-5 box-5"
        "box-5 box-5 box-5 box-5 box-5";


    }
} 
</style>
<html>
    <body>
        <div class="grid-container">
            <div class="box" style="grid-area: box-1"></div>
            <div class="box" style="grid-area: box-2"></div>
            <div class="box" style="grid-area: box-3"></div>
            <div class="box" style="grid-area: box-4"></div>
            <div class="box" style="grid-area: box-5"></div>
        </div>
    </body>
</html>
