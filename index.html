<!Doctype html>
<html lang="en">
<head>
    <style>
        body{
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2%;
            background-image: url("background.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
        a{
            text-align: center;
            display: flex;
            justify-content: center;
            font-size: 150%;
            padding-top: 10%;
            color: rgb(168, 26, 26);
            font-family: pixelfy;
 
        }
        h1{
            text-align: center;
            display: flex;
            justify-content: center;
            color: rgb(168, 26, 26);
            font-family: jaquard;
        }
        h2{
            text-align: center;
            display: flex;
            justify-content: center;
            color: rgb(168, 26, 26);
            font-family: jaquard;
        }
        .box{
            background-color: rgb(0, 0, 0);
        }
        .grid-container{
            display: grid;
            grid-template-columns: 100px 100px 200px 200px 200px 100px 100px;
            grid-template-rows: 150px 100px 100px 100px 80px 80px 200px;
            gap: 1em;
            grid-auto-rows:  1fr;
            grid-template-areas:
            "box-1 box-1 box-1 box-1 box-1 box-1 box-1"

            "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
            "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
            "box-2 box-2 box-5 box-6 box-6 box-4 box-4"
            "box-2 box-2 box-5 box-7 box-7 box-4 box-4"
            "box-2 box-2 box-5 box-7 box-7 box-4 box-4"
            "box-8 box-8 box-9 box-9 box-9 box-10 box-10"
            "box-8 box-8 box-9 box-9 box-9 box-10 box-10";
            
        }
        @font-face {
            font-family: pixelfy;
            src: url("PixelifySans-Medium.ttf");
            font-family: jaquard;
            src: url("PixelifySans-SemiBold.ttf");
        }
        @media(max-width: 56em){
            .grid-container{
                grid-template-columns: 100px 100px 200px 200px 200px 100px 100px;
                grid-template-rows: 150px 100px 100px 100px 80px 80px 200px;
                grid-template-areas:
                "box-1 box-1 box-1 box-1 box-1 box-1 box-1"

                "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
                "box-2 box-2 box-3 box-3 box-3 box-4 box-4"
                "box-2 box-2 box-5 box-6 box-6 box-4 box-4"
                "box-2 box-2 box-5 box-7 box-7 box-4 box-4"
                 "box-2 box-2 box-5 box-7 box-7 box-4 box-4"
                "box-8 box-8 box-9 box-9 box-9 box-10 box-10"
                "box-8 box-8 box-9 box-9 box-9 box-10 box-10";
             }
        } 
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="box" style="grid-area: box-1">
            <h1>Welcome To The World</h1>
        </div>

        <div class="box" style="grid-area: box-2">
            <h2>Visit:</h2>
            <hr>
            <a>Movies</a>
            <br>
            <a>Series</a>
            <br>
            <a>Games</a>
            <br>
            <a>Hobbies</a>
            <br>
            <a>Projects</a>
            <br>
            <a>Blog</a>
        </div>
        <div class="box" style="grid-area: box-3">
            <h2>About:</h2>
            <hr>
        </div>
        <div class="box" style="grid-area: box-4"></div>
        <div class="box" style="grid-area: box-5"></div>
        <div class="box" style="grid-area: box-6"></div>
        <div class="box" style="grid-area: box-7"></div>
        <div class="box" style="grid-area: box-8"></div>
        <div class="box" style="grid-area: box-9"></div>
        <div class="box" style="grid-area: box-10"></div>
    </div>

</body>
</html>
